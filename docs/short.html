<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>大撈家放空版</title>
<style>
  :root{
    --bg:#0b0e11;
    --panel:#12161c;
    --line:#232830;
    --text:#e7e9ec;
    --muted:#7a8290;
    --up:#e05656;
    --down:#2fae6b;
    --gold:#d4a72c;
    --accent:#2fae6b;
    --mono: "SFMono-Regular","Consolas","Liberation Mono",monospace;
    --sans: -apple-system,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  header{
    position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg,#0d1116,#0b0e11 90%);
    border-bottom:1px solid var(--line);
    padding:16px 18px 12px;
  }
  .eyebrow{
    display:flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:11px; letter-spacing:.08em;
    color:var(--muted); text-transform:uppercase;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--down);
    box-shadow:0 0 8px var(--down); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  h1{margin:6px 0 4px; font-size:22px; font-weight:700; letter-spacing:-.01em;}
  .sub{color:var(--muted); font-size:13px; font-family:var(--mono);}
  .params{
    margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;
  }
  .chip{
    font-family:var(--mono); font-size:11px; color:var(--text);
    background:var(--panel); border:1px solid var(--line);
    padding:4px 8px; border-radius:20px;
  }
  .day-tabs{
    margin-top:12px; display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
  }
  .day-tab{
    font-family:var(--mono); font-size:12.5px; white-space:nowrap;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    padding:6px 12px; border-radius:10px; cursor:pointer; flex-shrink:0;
  }
  .day-tab.active{
    background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;
  }
  main{padding:14px;}
  .empty{
    text-align:center; color:var(--muted); padding:60px 20px;
    font-family:var(--mono); font-size:13px; line-height:1.7;
  }
  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .left{min-width:0;}
  .ticker-row{display:flex; align-items:baseline; gap:8px;}
  .ticker{font-family:var(--mono); font-weight:700; font-size:15px;}
  .name{color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .meta{
    margin-top:6px; font-family:var(--mono); font-size:11.5px; color:var(--muted);
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .meta b{color:var(--text); font-weight:600;}
  .right{text-align:right; flex-shrink:0;}
  .bias-compare{
    display:flex; align-items:baseline; gap:4px; justify-content:flex-end;
    font-family:var(--mono);
  }
  .ref-bias{
    font-size:13px; color:var(--muted); text-decoration:line-through;
  }
  .arrow{color:var(--muted); font-size:12px;}
  .cur-bias{
    font-weight:700; font-size:17px;
    padding:3px 10px; border-radius:8px;
    color:var(--down); background:rgba(47,174,107,.12);
  }
  .ref-date{margin-top:6px; font-family:var(--mono); font-size:10.5px; color:var(--muted);}
  footer{
    text-align:center; color:var(--muted); font-family:var(--mono);
    font-size:11px; padding:24px 20px 10px; line-height:1.8;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow"><span class="dot"></span><span id="status-text">連線中</span></div>
  <h1>大撈家放空版</h1>
  <div class="sub" id="asof">最後更新:—</div>
  <div class="params" id="params"></div>
  <div class="day-tabs" id="day-tabs"></div>
</header>

<main id="main">
  <div class="empty">資料載入中…</div>
</main>

<footer>
  乖離背離放空訊號:近 N 交易日內曾出現 15MA 乖離觸及門檻的「參考日」,<br>
  之後盤中創新高、但當天乖離比參考日小(動能減弱),且 ATR14 達門檻<br>
  保留最近5個交易日的掃描結果,點上方日期切換<br>
  資料源:公開行情,僅供研究參考,非投資建議
</footer>

<script>
let historyData = [];
let activeIndex = 0;

function renderDay(idx){
  activeIndex = idx;
  const main = document.getElementById('main');
  const day = historyData[idx];
  if(!day) return;

  document.getElementById('asof').textContent = '更新時間:' + day.generated_at + '(共 ' + day.count + ' 檔)';

  const p = day.params;
  document.getElementById('params').innerHTML = `
    <span class="chip">近${p.ref_lookback_days}交易日內參考高點</span>
    <span class="chip">${p.bias_ma}MA 乖離參考點 ≥ ${p.ref_bias_threshold}%</span>
    <span class="chip">盤中創高但乖離縮小</span>
    <span class="chip">ATR14 ≥ ${p.atr_min_threshold}</span>
  `;

  document.querySelectorAll('.day-tab').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  if(!day.results.length){
    main.innerHTML = '<div class="empty">這天沒有符合條件的股票。</div>';
    return;
  }

  main.innerHTML = day.results.map(r => {
    return `
      <div class="card">
        <div class="left">
          <div class="ticker-row">
            <span class="ticker">${r.ticker.replace('.TWO','').replace('.TW','')}</span>
            <span class="name">${r.name}</span>
          </div>
          <div class="meta">
            <span>收盤 <b>${r.close}</b></span>
            ${r.revenue_month ? `<span style="color:var(--muted);font-size:10.5px;">(${r.revenue_month.toString().slice(-2)}月營收)</span>` : ''}
            ${r.revenue_mom_pct !== null && r.revenue_mom_pct !== undefined ? `<span>營收MoM <b style="color:${r.revenue_mom_pct>=0?'var(--up)':'var(--down)'}">${r.revenue_mom_pct>=0?'+':''}${r.revenue_mom_pct}%</b></span>` : ''}
            ${r.revenue_yoy_pct !== null && r.revenue_yoy_pct !== undefined ? `<span>營收YoY <b style="color:${r.revenue_yoy_pct>=0?'var(--up)':'var(--down)'}">${r.revenue_yoy_pct>=0?'+':''}${r.revenue_yoy_pct}%</b></span>` : ''}
            <span>${r.market}</span>
          </div>
        </div>
        <div class="right">
          <div class="bias-compare">
            <span class="ref-bias">${r.ref_bias_pct}%</span>
            <span class="arrow">→</span>
            <span class="cur-bias">${r.bias_pct}%</span>
          </div>
          <div class="ref-date">參考日 ${r.ref_date}</div>
        </div>
      </div>
    `;
  }).join('');
}

async function load(){
  const main = document.getElementById('main');
  try{
    const res = await fetch('short_results.json?_=' + Date.now());
    const data = await res.json();

    document.getElementById('status-text').textContent = '已連線';
    historyData = data.history || [];

    if(!historyData.length){
      main.innerHTML = '<div class="empty">還沒有掃描結果。<br>請先讓 GitHub Actions 跑過一次。</div>';
      return;
    }

    document.getElementById('day-tabs').innerHTML = historyData.map((d, i) =>
      `<div class="day-tab" data-idx="${i}">${d.date}</div>`
    ).join('');

    document.querySelectorAll('.day-tab').forEach(el => {
      el.addEventListener('click', () => renderDay(parseInt(el.dataset.idx)));
    });

    renderDay(0);

  }catch(e){
    document.getElementById('status-text').textContent = '尚無資料';
    main.innerHTML = '<div class="empty">還沒有掃描結果。<br>請先讓 GitHub Actions 跑過一次,<br>或手動觸發 workflow。</div>';
  }
}
load();
</script>

</body>
</html>
