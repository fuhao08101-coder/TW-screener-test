name: Daily TW Stock Short Screener
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 9 * * 1-5"   # 台北時間 17:30(UTC 09:30),週一到週五(台股交易日)
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run short screener
        run: python src/run_short.py
      - name: Commit results
        run: |
          git config user.name "tw-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/short_results.json
          git diff --staged --quiet || git commit -m "chore: update short screener results $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
