name: Debug Single Ticker

on:
  workflow_dispatch:
    inputs:
      ticker_code:
        description: "股票代號(不用加 .TW,例如 6414)"
        required: true
        default: "6414"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose ticker
        run: python src/debug_ticker.py "${{ github.event.inputs.ticker_code }}"
